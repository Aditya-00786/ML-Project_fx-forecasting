[project]
name = "fxml"
version = "0.1.0"
description = "Regime-aware learning of returns and volatility in G10 currency markets (BITS F464 project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "arch>=7.0",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploratory: allow imports mid-cell, long plotting lines and plain zip().
"notebooks/*" = ["E402", "E501", "B905", "I001"]
