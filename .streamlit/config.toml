# Theme for dashboard/app.py, from the same tokens as reports/dashboard.html:
# a neutral bulletin ground, square corners, and violet reserved for what is selected.
[theme]
font = "sans-serif"
baseRadius = "none"
showWidgetBorder = true

[theme.light]
primaryColor = "#3f2bb0"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f5f5f2"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"

[theme.dark]
primaryColor = "#d6c9ff"
backgroundColor = "#111416"
secondaryBackgroundColor = "#171b1e"
textColor = "#f1f3f4"
borderColor = "#2a3035"

[browser]
gatherUsageStats = false
